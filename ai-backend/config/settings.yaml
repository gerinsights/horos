# Neuro DICOM AI Backend Configuration

dicom:
  # AI segmentation node
  ai_segment:
    ae_title: AI_SEGMENT
    port: 4242

  # Central PACS server
  pacs_core:
    ae_title: PACS_CORE
    host: localhost
    port: 4242

  # Horos workstation
  horos:
    ae_title: HOROS_M1
    host: localhost
    port: 11112

orthanc:
  url: http://localhost:8042
  username: orthanc
  password: orthanc

models:
  base_path: /app/models

  cta_vessels:
    framework: nnunet  # nnunet | monai
    model_path: nnunet/cta_vessels
    task_id: "500"
    description: Intracranial and cervical vessel segmentation

  brain_extraction:
    framework: monai
    model_path: monai/brain_extraction
    description: Brain mask extraction (skull stripping)

  tissue_segmentation:
    framework: nnunet
    model_path: nnunet/tissue_seg
    task_id: "501"
    description: Gray matter, white matter, CSF segmentation

pipelines:
  cta:
    enabled: true
    models:
      - cta_vessels
    output_formats:
      - dicom_seg
      - secondary_capture

  mri:
    enabled: false  # Phase 2
    models:
      - brain_extraction
      - tissue_segmentation
    output_formats:
      - dicom_seg
      - secondary_capture

routing:
  # Criteria for auto-routing studies to AI pipelines
  cta:
    modality: CT
    body_part: [HEAD, NECK]
    description_contains: [CTA, ANGIO]

  mri:
    modality: MR
    body_part: [HEAD, BRAIN]

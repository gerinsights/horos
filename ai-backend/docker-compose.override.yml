# ROCm GPU passthrough for AMD RX 7600 XT (RDNA 3, gfx1102)
# This file is automatically loaded by docker compose alongside docker-compose.yml.
# For CUDA: replace with docker-compose.cuda.yml
# For CPU-only: delete this file
services:
  ai-service:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.2

  ollama:
    devices:
      - /dev/kfd
      - /dev/dri
    group_add:
      - video
      - render
    environment:
      - HSA_OVERRIDE_GFX_VERSION=11.0.2
      - OLLAMA_GPU_DRIVER=rocm

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.backends"

[project]
name = "neuro-dicom-ai"
version = "0.1.0"
description = "Neuro CTA/MRI AI segmentation backend for Horos PACS workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydicom>=2.4",
    "highdicom>=0.23",
    "SimpleITK>=2.4",
    "nibabel>=5.3",
    "numpy>=1.26",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "httpx>=0.28",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
    "mcp>=1.0",
]

[project.optional-dependencies]
nnunet = ["nnunetv2>=2.5"]
monai = ["monai[all]>=1.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]

[project.scripts]
neuro-ai = "src.main:run"
neuro-mcp = "src.mcp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

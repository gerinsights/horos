# DICOM Segmentation Backend Configuration

dicom:
  # AI segmentation node
  ai_segment:
    ae_title: AI_SEGMENT
    port: 4242

  # Upstream PACS server
  pacs:
    ae_title: PACS
    host: localhost
    port: 4242

orthanc:
  url: http://localhost:8042
  username: ai-service
  password: change-me-in-env  # Override via ORTHANC_PASSWORD env var

# ── LLM (Ollama) ──
llm:
  url: http://ollama:11434
  default_model: llama3.2:3b
  report_model: llama3.2:3b
  triage_model: llama3.2:3b
  temperature: 0.3
  max_tokens: 1024

# ── Security ──
security:
  fips_mode: true
  tls:
    min_protocol: TLSv1.2
    ciphers: ECDHE+AESGCM
    cert_path: /app/certs/server.crt
    key_path: /app/certs/server.key
    ca_path: /app/certs/ca.crt

models:
  base_path: /app/models

  cta_vessels:
    framework: nnunet  # nnunet | monai
    model_path: nnunet/cta_vessels
    task_id: "500"
    description: Intracranial and cervical vessel segmentation

  brain_extraction:
    framework: monai
    model_path: monai/brain_extraction
    description: Brain mask extraction (skull stripping)

  tissue_segmentation:
    framework: nnunet
    model_path: nnunet/tissue_seg
    task_id: "501"
    description: Gray matter, white matter, CSF segmentation

pipelines:
  cta:
    enabled: true
    models:
      - cta_vessels
    output_formats:
      - dicom_seg
      - secondary_capture
      - rtstruct

  mri:
    enabled: false  # Phase 2
    models:
      - brain_extraction
      - tissue_segmentation
    output_formats:
      - dicom_seg
      - secondary_capture

routing:
  # Criteria for auto-routing studies to AI pipelines
  cta:
    modality: CT
    body_part: [HEAD, NECK]
    description_contains: [CTA, ANGIO]

  mri:
    modality: MR
    body_part: [HEAD, BRAIN]
